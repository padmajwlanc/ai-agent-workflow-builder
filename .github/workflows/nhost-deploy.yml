name: Deploy Nhost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nhost CLI
        run: |
          sudo curl -L https://raw.githubusercontent.com/nhost/nhost/main/cli/get.sh | bash

      - name: Deploy to Nhost
        working-directory: backend
        env:
          NHOST_EMAIL: ${{ secrets.NHOST_EMAIL }}
          NHOST_PASSWORD: ${{ secrets.NHOST_PASSWORD }}
        run: |
          nhost login \
            --email "$NHOST_EMAIL" \
            --password "$NHOST_PASSWORD"
          nhost deployments new \
            --subdomain qhdhzninoxahvtvpaytg \
            --ref main \
            --follow